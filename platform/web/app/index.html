<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<base href="/" />
		<meta name="theme-color" content="#0A0A0A" />
		<base href="/" />
		<link rel="icon" type="image/svg+xml" href="../../../public/images/logo.svg" />
		<link rel="icon" type="image/x-icon" href="../../../public/favicon.ico" />
		<link rel="apple-touch-icon" href="../../../public/images/logo.svg" />
		<title>Plebeian Market</title>
		<!-- Phase 0 display/body families for the warm-editorial tokens. The
		     generic fallbacks in styles/globals-new.css keep a fontless host
		     rendering. Mirrors the widget book's Google Fonts link. -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400..700&family=Fraunces:opsz,wght@9..144,400..700&display=swap"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/styles/index.css" />
		<script>
			// Dynamically add manifest to avoid Bun bundler resolution issues
			var link = document.createElement('link')
			link.rel = 'manifest'
			link.href = '/manifest.json'
			document.head.appendChild(link)
		</script>
		<script type="module" src="./polyfills.ts"></script>
		<script type="module" src="../frontend.tsx" async></script>
	</head>
	<body>
		<div id="root"></div>
	</body>
</html>
